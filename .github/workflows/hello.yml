name: Docker CD

on:
  push:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: github-actions-practice

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python test_app.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::228210524459:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ 
          steps.login-ecr.outputs.registry }}/${{ 
          env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids i-0eeae6a0b74326b5f \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 228210524459.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 228210524459.dkr.ecr.ap-south-1.amazonaws.com/github-actions-practice:${{ github.sha }}",
              "docker rm -f github-actions-app || true",
              "docker run -d --name github-actions-app -p 5000:5000 228210524459.dkr.ecr.ap-south-1.amazonaws.com/github-actions-practice:${{ github.sha }}"
            ]' \
            --region ap-south-1
